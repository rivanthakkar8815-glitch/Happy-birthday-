<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Countdown to Vidhi's Birthday 🎂</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#ff9a9e,#fad0c4,#fbc2eb);
overflow:hidden;
text-align:center;
color:white;
}

.container{
padding:30px;
}

h1{
font-size:3rem;
margin-bottom:20px;
text-shadow:0 0 15px rgba(255,255,255,0.8);
}

#countdown{
font-size:2rem;
font-weight:bold;
background:rgba(255,255,255,0.2);
padding:20px;
border-radius:20px;
backdrop-filter:blur(10px);
display:inline-block;
margin-top:20px;
}

.message{
margin-top:25px;
font-size:1.2rem;
}

.balloon{
position:absolute;
bottom:-100px;
font-size:50px;
animation:float 10s linear infinite;
}

@keyframes float{
0%{
transform:translateY(0);
}
100%{
transform:translateY(-120vh);
}
}
</style>
</head>

<body>

<div class="balloon" style="left:10%;animation-delay:0s;">🎈</div>
<div class="balloon" style="left:30%;animation-delay:2s;">🎈</div>
<div class="balloon" style="left:50%;animation-delay:4s;">🎈</div>
<div class="balloon" style="left:70%;animation-delay:1s;">🎈</div>
<div class="balloon" style="left:90%;animation-delay:3s;">🎈</div>

<div class="container">
<h1>🎂 Happy Birthday Vidhi 🎂</h1>

<div id="countdown">
Loading...
</div>

<p class="message">
Counting down to your special day 💖
</p>
</div>

<script>

let birthday = new Date(new Date().getFullYear(), 5, 12);

if(new Date() > birthday){
birthday = new Date(new Date().getFullYear() + 1, 5, 12);
}

setInterval(() => {

const now = new Date().getTime();
const distance = birthday.getTime() - now;

const days = Math.floor(distance / (1000 * 60 * 60 * 24));
const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
const seconds = Math.floor((distance % (1000 * 60)) / 1000);

if(distance > 0){
document.getElementById("countdown").innerHTML =
`${days} Days ${hours} Hours ${minutes} Minutes ${seconds} Seconds`;
}else{
document.getElementById("countdown").innerHTML =
"🎉 Happy Birthday Vidhi! 🎉";
}

},1000);

</script>

</body>
</html>
